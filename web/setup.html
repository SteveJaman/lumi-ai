<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumi — Setup</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<div class="auth-screen setup-screen">
  <div class="setup-card">

    <div class="setup-progress" id="setup-progress">
      <div class="setup-step-dot" data-step="account">1</div>
      <div class="setup-step-line"></div>
      <div class="setup-step-dot" data-step="providers">2</div>
      <div class="setup-step-line"></div>
      <div class="setup-step-dot" data-step="integrations">3</div>
      <div class="setup-step-line"></div>
      <div class="setup-step-dot" data-step="done">4</div>
    </div>

    <div class="setup-body" id="setup-body"></div>

    <div id="auth-error" class="auth-error"></div>
  </div>
</div>
<script type="module" src="/web/setup.js"></script>
</body>
</html>
