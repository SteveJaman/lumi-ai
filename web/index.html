<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumi</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>

<div id="app-shell" class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">◆</div>
      <div>
        <div class="brand-name">Lumi</div>
        <div class="brand-sub" id="host-name">—</div>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-footer">
      <div class="status-pills">
        <div class="pill">
          <span class="dot" id="dot-vts"></span> VTube Studio
        </div>
        <div class="pill">
          <span class="dot" id="dot-mic"></span> Microphone
        </div>
        <div class="pill">
          <span class="dot ok" id="dot-ollama"></span> Ollama
        </div>
      </div>

      <div class="user-chip">
        <div class="avatar" id="user-avatar">?</div>
        <span class="grow" id="user-name">—</span>
        <button class="btn btn-ghost btn-sm" id="btn-logout"
                title="Sign out">⏻</button>
      </div>
    </div>
  </aside>

  <main class="main" id="main-content"></main>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script type="module" src="/web/app.js"></script>
</body>
</html>
