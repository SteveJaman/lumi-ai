<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumi</title>
<script src="/web/theme-init.js"></script>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>

<div id="app-shell" class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" id="brand-logo">
        <span class="brand-logo-mark">◆</span>
        <img src="/web/Lumi.png" alt="" class="brand-logo-img"
             onerror="this.style.display='none'">
      </div>
      <div>
        <div class="brand-name">Lumi</div>
        <div class="brand-sub" id="host-name">—</div>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-footer">
      <div class="status-pills">
        <div class="pill">
          <span class="dot" id="dot-vts"></span> VTube Studio
        </div>
        <div class="pill">
          <span class="dot" id="dot-mic"></span> Microphone
        </div>
        <div class="pill">
          <span class="dot" id="dot-ollama"></span> Ollama
        </div>
      </div>

      <div class="user-chip">
        <div class="avatar" id="user-avatar">?</div>
        <span class="grow" id="user-name">—</span>
        <button class="btn btn-ghost btn-sm theme-toggle" id="theme-toggle" title="Switch to dark mode" aria-label="Toggle theme">☾</button>

        <!-- GitHub repository link -->
        <a class="btn btn-ghost btn-sm github-link"
          href="https://github.com/SteveJaman/lumi-ai"
          target="_blank"
          rel="noopener noreferrer"
          title="View source on GitHub"
          aria-label="View source on GitHub">
          <svg class="github-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2 0 1.9 1.2 1.9 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6.1-3.2 0 0 1-.3 3.4 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.6.3 2.8.1 3.2.8.8 1.3 1.9 1.3 3.2 0 4.6-2.8 5.6-5.5 5.9.5.4.9 1.1.9 2.2v3.3c0 .3.1.7.8.6A12 12 0 0 0 12 .3"/>
          </svg>
        </a>

        <button class="btn btn-ghost btn-sm" id="btn-logout" title="Sign out">⏻</button>
      </div>
    </div>
  </aside>

  <main class="main" id="main-content"></main>

  <!-- Bloom loader — overlays the main pane, dismissed when boot completes -->
  <div id="boot-loader" class="boot-loader hidden" aria-live="polite">
    <div class="boot-flower" aria-hidden="true">
      <div class="petal" style="--i:0"></div>
      <div class="petal" style="--i:1"></div>
      <div class="petal" style="--i:2"></div>
      <div class="petal" style="--i:3"></div>
      <div class="petal" style="--i:4"></div>
      <div class="petal" style="--i:5"></div>
      <div class="petal" style="--i:6"></div>
      <div class="petal" style="--i:7"></div>
      <div class="boot-flower-center"></div>
    </div>
    <div class="boot-title" id="boot-title">waking up…</div>
    <ul class="boot-steps" id="boot-steps"></ul>
    <button class="boot-skip hidden" id="boot-skip" type="button">Skip →</button>
  </div>

</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script type="module" src="/web/app.js"></script>
</body>
</html>
