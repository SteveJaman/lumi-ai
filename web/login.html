<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumi — Sign in</title>
<script src="/web/theme-init.js"></script>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">◆</div>
      <div class="auth-title" id="auth-title">Welcome back</div>
      <div class="auth-sub" id="auth-sub">Sign in to continue</div>
    </div>

    <div id="auth-error" class="auth-error"></div>

    <form id="auth-form" autocomplete="on">
      <div class="field">
        <label class="label" for="auth-username">Username</label>
        <input class="input" id="auth-username" name="username"
               autocomplete="username" required>
      </div>
      <div class="field" id="auth-display-field" style="display:none">
        <label class="label" for="auth-display">Display name</label>
        <input class="input" id="auth-display" name="display_name"
               autocomplete="name">
      </div>
      <div class="field">
        <label class="label" for="auth-password">Password</label>
        <input class="input" id="auth-password" name="password"
               type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" type="submit"
              id="auth-submit" style="width:100%">Sign in</button>
    </form>

    <div class="auth-switch">
      <span id="auth-switch-text">No account?</span>
      <a id="auth-switch-link" style="cursor:pointer">Register</a>
    </div>
  </div>
</div>
<script type="module" src="/web/login.js"></script>
</body>
</html>
