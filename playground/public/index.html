<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lumi — Playground</title>

    <meta name="description" content="Meet Lumi — a hyper-expressive AI companion. Chat with her in your browser. No install, no signup, no server.">
    <meta name="theme-color" content="#171426">

    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/Lumi.png">
    <link rel="manifest" href="/manifest.webmanifest">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Lumi — Playground">
    <meta property="og:description" content="Chat with Lumi. Runs entirely in your browser.">
    <meta property="og:image" content="/Lumi.png">
    <meta property="og:url" content="https://lumi-playground.vercel.app/">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Lumi — Playground">
    <meta name="twitter:description" content="Chat with Lumi. Runs entirely in your browser.">
    <meta name="twitter:image" content="/Lumi.png">

    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <!-- ==========================================================
         Animated background
         ========================================================== -->
    <div class="bg-layer" aria-hidden="true">
        <video class="bg-video"
               autoplay loop muted playsinline preload="auto"
               poster="/Lumi-room.png">
            <source src="/lumi_room_loop.mp4" type="video/mp4">
        </video>

        <div class="aurora"></div>
        <div class="orb orb-teal"></div>
        <div class="orb orb-lavender"></div>
        <div class="orb orb-pink"></div>

        <div class="bubbles">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
        </div>

        <div class="stars"></div>
        <div class="grain"></div>
    </div>

    <!-- ==========================================================
         Bloom loader
         ========================================================== -->
    <div id="loader" class="loader" role="status" aria-live="polite">
        <div class="flower" aria-hidden="true">
            <div class="petal" style="--i:0"></div>
            <div class="petal" style="--i:1"></div>
            <div class="petal" style="--i:2"></div>
            <div class="petal" style="--i:3"></div>
            <div class="petal" style="--i:4"></div>
            <div class="petal" style="--i:5"></div>
            <div class="petal" style="--i:6"></div>
            <div class="petal" style="--i:7"></div>
            <div class="flower-center"></div>
            <div class="flower-glow"></div>
        </div>
        <div class="loader-text" id="loader-text">waking up…</div>
    </div>

    <!-- ==========================================================
         App
         ========================================================== -->
    <div id="app" class="app">

        <header>
            <div class="brand">
                <div class="avatar-wrap">
                    <img src="/Lumi.png" alt="" class="avatar-mini">
                    <span class="avatar-glow"></span>
                </div>
                <div class="brand-text">
                    <h1>Lumi</h1>
                    <p id="model-status" class="status">
                        <span class="dot"></span>
                        <span class="status-text">AI runs entirely on your device</span>
                    </p>
                </div>
            </div>
            <button id="new-chat" class="icon-btn" title="New chat" aria-label="Start a new chat">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
            </button>
        </header>

        <!-- Emotion meter — floats above the chat -->
        <div id="emotion-display" class="emotion-display">
            <span class="emotion-emoji" id="emotion-emoji">🌸</span>
            <span class="emotion-name"  id="emotion-name">happy</span>
        </div>

        <main id="messages" class="messages" aria-live="polite" aria-label="Chat messages">
            <div class="message assistant">
                <div class="bubble">
                    <span class="spark">✨</span><span id="welcome-text">hey! i'm running in playground mode here — no avatar, no mic, and i don't remember anything between visits. but i'm still me. what's up?</span>
                </div>
            </div>

            <div class="suggestions" id="suggestions">
                <button type="button" data-prompt="who are you really?">who are you really?</button>
                <button type="button" data-prompt="tell me something that surprised you recently">tell me something surprising</button>
                <button type="button" data-prompt="what's your favorite kind of weather?">what's your favorite weather?</button>
                <button type="button" data-prompt="say something to make me smile">cheer me up</button>
            </div>
        </main>

        <footer>
            <form id="chat-form" class="composer">
                <label for="user-input" class="sr-only">Your message</label>
                <textarea id="user-input"
                          placeholder="say something to lumi…"
                          rows="1"
                          autocomplete="off"
                          spellcheck="false"
                          disabled></textarea>
                <button type="submit" id="send-button" aria-label="Send message" disabled>
                    <svg class="icon-send" viewBox="0 0 24 24" width="20" height="20"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 2 11 13"/>
                        <path d="M22 2 15 22l-4-9-9-4Z"/>
                    </svg>
                    <span class="label">Send</span>
                </button>
            </form>

            <p class="footnote">
                persona subset of
                <a href="https://github.com/SteveJaman/lumi-ai" target="_blank" rel="noopener">lumi</a>
                · no data leaves your browser
            </p>
        </footer>

    </div>

    <script type="module" src="/chat.js"></script>
</body>
</html>
