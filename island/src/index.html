<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumi Island</title>
  <link rel="stylesheet" href="island.css">
</head>
<body>
  <div id="island" class="island hidden" data-status="offline">

    <!-- Peek (hover) and open (click): Lumi and what she's doing -->
    <button id="face" class="face" type="button" aria-label="Lumi">
      <img class="avatar" src="lumi.png" alt="" draggable="false">
      <span class="who">
        <span class="name">Lumi</span>
        <span id="status" class="status">Offline</span>
      </span>
      <span class="dot" aria-hidden="true"></span>
    </button>
    <p id="note" class="note">Nothing needs you. Approval requests will appear here.</p>

    <!-- Approval: stays until answered -->
    <section id="approval" class="ask" role="alertdialog" aria-labelledby="tool" inert>
      <div id="eyebrow" class="eyebrow">Lumi wants to run</div>
      <div id="tool" class="tool"></div>
      <pre id="preview" class="preview"></pre>
      <div class="actions">
        <button id="decline" class="btn btn-decline" type="button">Decline</button>
        <button id="approve" class="btn btn-approve" type="button">Approve</button>
      </div>
      <span id="more" class="more" hidden></span>
    </section>

  </div>
  <script src="island.js"></script>
</body>
</html>
